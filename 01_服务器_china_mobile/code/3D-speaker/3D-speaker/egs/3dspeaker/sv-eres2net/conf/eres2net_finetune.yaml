# ============================================================
# ERes2Net-large 鲁棒微调 v2
# 冻结: conv1/bn1/layer1/layer2
# 训练: layer3/layer4/fusion/pooling/embedding/classifier
# 增强: Clean + Positive SNR + Negative SNR + Overlap2 + Overlap3
#       无外层 aug_prob，概率直接对应最终比例
# ============================================================

# ---- inputs (set via run script) ----
data:
noise:
reverb:
overlap_spk2utt:

# ---- outputs ----
exp_dir:

# ---- basic ----
num_epoch: 20
save_epoch_freq: 1
log_batch_freq: 50
seed: 2026

wav_len: 3.0
sample_rate: 16000
speed_pertub: False
lr: 0.0002

# ---- dataloader ----
batch_size: 128
num_workers: 8

# ---- model ----
fbank_dim: 80
embedding_size: 512
m_channels: 64
num_classes: 10000

# ---- frozen modules (conv1 ~ layer2) ----
frozen_modules:
  - conv1
  - bn1
  - layer1
  - layer2

# ---- layerwise LR (absolute values, not multipliers) ----
layerwise_lr:
  layer3: 0.00001
  layer4: 0.00002
  layer1_downsample: 0.00002
  layer2_downsample: 0.00002
  layer3_downsample: 0.00002
  fuse_mode12: 0.00002
  fuse_mode123: 0.00002
  fuse_mode1234: 0.00002
  pool: 0.00005
  seg_1: 0.00005
  classifier: 0.00005

# ---- wav reader ----
wav_reader:
  obj: speakerlab.process.processor.WavReader
  args:
    duration: <wav_len>
    sample_rate: <sample_rate>
    speed_pertub: <speed_pertub>

# ---- label encoder ----
label_encoder:
  obj: speakerlab.process.processor.SpkLabelEncoder
  args:
    data_file: <data>

# ---- feature extractor ----
feature_extractor:
  obj: speakerlab.process.processor.FBank
  args:
    n_mels: <fbank_dim>
    sample_rate: <sample_rate>
    mean_nor: True

# ---- augmentation (v2: no outer aug_prob, no reverb) ----
augmentations:
  obj: speakerlab.process.processor.RobustSpkAug
  args:
    noise_file: <noise>
    reverb_file: <reverb>
    clean_prob: 0.50
    pos_noise_prob: 0.15
    neg_noise_prob: 0.15
    overlap2_prob: 0.15
    overlap3_prob: 0.05
    pos_snr_low: 0.0
    pos_snr_high: 15.0
    neg_snr_low: -5.0
    neg_snr_high: 0.0
    overlap_tir_db: 0.0
    overlap_spk2utt: <overlap_spk2utt>

preprocessor:
  wav_reader: <wav_reader>
  label_encoder: <label_encoder>
  augmentations: <augmentations>
  feature_extractor: <feature_extractor>

# ---- epoch counter ----
epoch_counter:
  obj: speakerlab.utils.epoch.EpochCounter
  args:
    limit: <num_epoch>

# ---- dataset ----
dataset:
  obj: speakerlab.dataset.dataset.WavSVDataset
  args:
    data_file: <data>
    preprocessor: <preprocessor>

# ---- dataloader ----
dataloader:
  obj: torch.utils.data.DataLoader
  args:
    dataset: <dataset>
    batch_size: <batch_size>
    num_workers: <num_workers>
    pin_memory: True
    drop_last: True

# ---- embedding model ----
embedding_model:
  obj: speakerlab.models.eres2net.ERes2Net.ERes2Net
  args:
    feat_dim: <fbank_dim>
    embedding_size: <embedding_size>
    m_channels: <m_channels>

# ---- classifier ----
classifier:
  obj: speakerlab.models.campplus.classifier.CosineClassifier
  args:
    input_dim: <embedding_size>
    out_neurons: <num_classes>

# ---- optimizer ----
optimizer:
  obj: torch.optim.SGD
  args:
    params:
    lr: <lr>
    momentum: 0.9
    nesterov: True
    weight_decay: 0.00005

# ---- lr scheduler ----
lr_scheduler:
  obj: speakerlab.process.scheduler.WarmupCosineScheduler
  args:
    optimizer: <optimizer>
    min_lr: !!float 1e-6
    max_lr: <lr>
    warmup_epoch: 2
    fix_epoch: <num_epoch>
    step_per_epoch:

# ---- loss (ArcFace) ----
loss:
  obj: speakerlab.loss.margin_loss.ArcMarginLoss
  args:
    scale: 32.0
    margin: 0.15
    easy_margin: False

# ---- margin scheduler ----
margin_scheduler:
  obj: speakerlab.process.scheduler.MarginScheduler
  args:
    criterion: <loss>
    initial_margin: 0.05
    final_margin: 0.15
    increase_start_epoch: 1
    fix_epoch: 16
    step_per_epoch:

# ---- checkpoint ----
checkpointer:
  obj: speakerlab.utils.checkpoint.Checkpointer
  args:
    checkpoints_dir: <exp_dir>/models
    recoverables:
      embedding_model: <embedding_model>
      classifier: <classifier>
      epoch_counter: <epoch_counter>

# 锚 = ns05 hard 曲线 ep1 7.642 / ep2 7.597 / ep3 6.881; 预声明 ep3<6.64 → 官方

[paths]
sv_ecapa = "/data/home/ligangrui/china_mobile/code/3D-speaker/3D-speaker/egs/3dspeaker/sv-ecapa"
fullsubnet_root = "/home/ligangrui/china_mobile/AI/8.17/code"
fullsubnet_ckpt = "/data/home/ligangrui/china_mobile/AI/8.18/exp/spk_preserve/checkpoint_epoch10.tar"
verifier_ckpt = "/data/home/ligangrui/china_mobile/AI/8.24/exp/soup5/checkpoints/checkpoint_soup5.tar"
proto_npz = "/data/home/ligangrui/china_mobile/AI/8.21/exp/prototypes/prototypes.npz"
data_dir_820 = "/data/home/ligangrui/china_mobile/AI/8.22/exp/data_90k/data"
exp_dir = "/data/home/ligangrui/china_mobile/AI/8.27/exp/tse_v3_nsspeech"
spk_embs = "/data/home/ligangrui/china_mobile/AI/8.26/exp/tse/spk_embs.npz"

[acoustics]
sr = 16000
n_fft = 512
win_length = 512
hop_length = 256

[dataset]

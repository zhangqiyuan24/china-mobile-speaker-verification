max_train_samples = 30000
snr_range = [0, -5]
sub_sample_length = 3.0
batch_size = 2
num_workers = 6

[model]
sb_num_neighbors = 15
fb_num_neighbors = 0
num_freqs = 257
look_ahead = 2
sequence_model = "LSTM"
fb_output_activate_function = "ReLU"
